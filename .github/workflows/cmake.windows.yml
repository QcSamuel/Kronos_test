name: Generate Windows Installer

on:
  push:
    branches: [ kronos-cmake_ci ]
  pull_request:
    branches: [ kronos-cmake_ci ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://github.com
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        modules: 'all'
        cache: 'true'
        aqtversion: '>=3.0'
    - name: Download SDL2
      shell: pwsh
      run: |
          $base = "https://github.com/libsdl-org/SDL/releases/download"
          $file = "release-2.32.10/SDL2-devel-2.32.10-VC.zip"
          Invoke-WebRequest -OutFile SDL2.zip -Uri "$base/$file"
    - name: Install SDL2
      shell: pwsh
      run: |
          Expand-Archive -Force SDL2.zip .\
          mv SDL2-2.32.10 ${{github.workspace}}/SDL2
          rm SDL2.zip
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org
      env:
        sdl2lib_DIR: ${{github.workspace}}\SDL2
        sdl2_DIR: ${{github.workspace}}\SDL2\cmake
      run: |
        cmake -S ${{github.workspace}}/yabause -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DYAB_IS_WIP=ON

    - name: Setup NSIS
      uses: negrutiu/nsis-install@v2

    - name: Build
      # Build your program with the given configuration
      run: |
        echo "Compiling"
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    #- name: Test
      #working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org for more detail
      #run: ctest -C ${{env.BUILD_TYPE}}
    - name: Prepare package
      id: rename
      shell: bash
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)
        NAME=$(find build/ -maxdepth 1 -iname "kronos-*.exe")
        mv $NAME kronos-win64-$SHORT_SHA.exe
        echo "ReleaseFile=kronos-win64-$SHORT_SHA.exe" >> "$GITHUB_ENV"
        echo "ArtifactName=kronos-win64-$SHORT_SHA" >> "$GITHUB_ENV"
    - name: Binary upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.ArtifactName}}
        path: ${{env.ReleaseFile}}
